(async function () {
    if (!await U.iniciar()) return;
    try { await U.marcacoes('marcacoes', { exemploMotivo: 'ex.: tem tirado os processadores muitas vezes esta semana' }); }
    catch (e) { document.getElementById('marcacoes').innerHTML = erroHTML(e); }
  })();
